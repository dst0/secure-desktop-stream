name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    name: Package sds-installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Floem, system dev libs, and zip
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang cmake zip \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Ensure NASM on Windows for aws-lc-sys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if (Test-Path 'C:\Program Files\NASM') {
              'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      - name: Resolve release tag & version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          ver="${tag#v}"
          ver="${ver:-0.1.0}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Package & verify archive (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash installer/packaging/package-release.sh --version "${{ steps.meta.outputs.version }}" --out dist
          archive=$(ls dist/sds-installer-*.zip | head -n 1)
          sha=$(awk '{print $1}' dist/SHA256SUMS)
          if [ "${{ runner.os }}" = "macOS" ]; then
            bash installer/bootstrap/install-macos.sh --archive "$archive" --sha256 "$sha" --dry-run
          else
            /bin/sh installer/bootstrap/install-linux.sh --archive "$archive" --sha256 "$sha" --dry-run
          fi
          mv dist/SHA256SUMS "dist/SHA256SUMS-${{ runner.os }}"

      - name: Package & verify archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File installer/packaging/package-release.ps1 -Version "${{ steps.meta.outputs.version }}" -OutDir dist
          $archive = (Get-Item dist\sds-installer-*-windows-*.zip | Select-Object -First 1).FullName
          $sha = ((Get-Content dist\SHA256SUMS-windows -Raw).Trim() -split '\s+')[0]
          pwsh -NoProfile -File installer/bootstrap/install-windows.ps1 -ArchivePath $archive -ExpectedSha256 $sha -DryRun

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sds-installer-${{ runner.os }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sds-installer-*
          merge-multiple: true
          path: release-assets

      - name: Assemble release manifests, bootstrappers, and SHA256SUMS.txt
        run: |
          set -euo pipefail
          rm -f release-assets/SHA256SUMS*
          cp \
            installer/bootstrap/get.sh \
            installer/bootstrap/install-macos.sh \
            installer/bootstrap/install-linux.sh \
            installer/bootstrap/install-windows.ps1 \
            installer/bootstrap/uninstall.sh \
            installer/bootstrap/uninstall.ps1 \
            release-assets/
          for required in latest.json linux-latest.txt windows-latest.json; do
            test -f "release-assets/$required"
          done
          tmp_sums=$(mktemp)
          (cd release-assets && LC_ALL=C sha256sum -- * > "$tmp_sums")
          mv "$tmp_sums" release-assets/SHA256SUMS.txt
          ls -la release-assets
          cat release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NOTES_FILE=$(mktemp)
          sed 's/^          //' > "$NOTES_FILE" <<'EOF'
          ## Secure Desktop Stream Installer Release

          Install cleanly from verified prebuilt release archives (without cloning first):

          **macOS & Linux:**
          ```bash
          curl -fsSL https://github.com/dst0/secure-desktop-stream/releases/latest/download/get.sh -o get.sh
          bash get.sh --release-base=https://github.com/dst0/secure-desktop-stream/releases/latest/download --auto-deps
          ```

          **Windows (PowerShell):**
          ```powershell
          Invoke-WebRequest -Uri https://github.com/dst0/secure-desktop-stream/releases/latest/download/install-windows.ps1 -OutFile install-windows.ps1
          powershell -ExecutionPolicy Bypass -File .\install-windows.ps1 -ReleaseBase https://github.com/dst0/secure-desktop-stream/releases/latest/download -AutoDeps -AllowUnsigned
          ```

          All archives are verified against their SHA-256 manifest before extraction (`SHA256SUMS.txt`, `latest.json`, `linux-latest.txt`, `windows-latest.json`).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" release-assets/* --title "Secure Desktop Stream Installer $TAG" --notes-file "$NOTES_FILE"
          fi
