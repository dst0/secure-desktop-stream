[package]
name = "sds-installer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Cross-platform hardened native installer and orchestrator for Secure Desktop Stream"

[lib]
name = "sds_installer"
path = "src/lib.rs"

[[bin]]
name = "sds-installer"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "1.18"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
flate2 = "1.1"
floem = { version = "0.2.0", default-features = false, features = ["vger"] }
hex = "0.4"
ratatui = "0.29"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
rustls = { version = "0.23.25", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
rustls-webpki = { version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.19"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "process", "signal"] }
tokio-rustls = { version = "0.26", default-features = false }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[patch.crates-io]
objc2 = { path = "patches/objc2-0.4.1" }
