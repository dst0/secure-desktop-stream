[General]
__userfile__=true
panels=panel1

[panel1]
position=Bottom
desktop=0
width=100
width-percent=true
panelSize=36
iconSize=24
reserve-space=true
hidable=false
plugins=fancymenu, desktopswitch, quicklaunch, showdesktop, taskbar, volume, tray, statusnotifier, worldclock

[fancymenu]
type=fancymenu
alignment=Left
buttonsAtTop=false
categoriesAtRight=false
filterClear=true
autoSel=true
menu_file=/etc/xdg/menus/lxqt-applications-compact.menu
showText=false
favorites\1\desktopFile=/usr/share/applications/pcmanfm-qt.desktop
favorites\2\desktopFile=/usr/share/applications/qterminal.desktop
favorites\size=2

[desktopswitch]
type=desktopswitch
alignment=Left

[quicklaunch]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\size=2

[showdesktop]
type=showdesktop
alignment=Left

[taskbar]
type=taskbar
alignment=Left
buttonWidth=220
closeOnMiddleClick=false
groupingEnabled=false

[volume]
type=volume
alignment=Right

[tray]
type=tray
alignment=Right

[statusnotifier]
type=statusnotifier
alignment=Right

[worldclock]
type=worldclock
alignment=Right
